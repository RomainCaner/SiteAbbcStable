<!--
  partials/navbar.html — Barre de navigation, injectee par core/partials.js.

  Le jeton {{base}} est remplace a l'injection par la profondeur de la page
  courante (« » a la racine, « ../ » depuis equipes/).

  Le contenu des sous-menus « Equipes » (#teams-menu-desktop et
  #teams-menu-mobile) est genere depuis assets/data/teams.json par
  ui/navigation.js : ne pas y ecrire d'equipes en dur.
-->

<div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>

<header class="bg-white shadow-md sticky top-0 z-50">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="Navigation principale">
    <div class="flex justify-between items-center h-16">

      <a href="{{base}}index.html" class="flex items-center gap-3 focus-ring rounded">
        <img src="{{base}}assets/images/Logo.jpg" alt="Logo ABBC" width="40" height="40" class="rounded-full">
        <span class="font-bold text-lg text-gray-800 hidden sm:inline">ABBC Cornebarrieu</span>
      </a>

      <!-- Navigation desktop -->
      <div class="hidden md:flex items-center gap-1">
        <a href="{{base}}index.html" class="nav-link px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition-colors" data-nav="accueil">Accueil</a>

        <div class="relative group">
          <a href="{{base}}equipes.html" class="nav-link px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition-colors flex items-center gap-1" data-nav="equipes" aria-haspopup="true">
            Équipes <i class="fas fa-chevron-down text-xs" aria-hidden="true"></i>
          </a>
          <div class="absolute left-1/2 -translate-x-1/2 top-full pt-2 hidden group-hover:block group-focus-within:block">
            <div id="teams-menu-desktop" class="bg-white shadow-xl rounded-lg p-6 w-[480px] grid grid-cols-2 gap-6" role="menu">
              <p class="col-span-2 text-sm text-gray-500">Chargement…</p>
            </div>
          </div>
        </div>

        <a href="{{base}}agenda.html" class="nav-link px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition-colors" data-nav="agenda">Agenda</a>
        <a href="{{base}}actualites.html" class="nav-link px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition-colors" data-nav="actualites">Actualités</a>
        <a href="{{base}}partenaires.html" class="nav-link px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition-colors" data-nav="partenaires">Partenaires</a>
        <a href="{{base}}boutique.html" class="nav-link px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition-colors" data-nav="boutique">Boutique</a>
        <a href="{{base}}contact.html" class="nav-link px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition-colors" data-nav="contact">Contact</a>

        <button data-theme-toggle class="ml-2 p-2 rounded-full hover:bg-gray-100 transition-colors focus-ring" aria-label="Basculer le mode sombre">
          <i data-theme-icon class="fas fa-moon text-gray-700" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Boutons mobile -->
      <div class="md:hidden flex items-center gap-2">
        <button data-theme-toggle class="p-2 rounded-full hover:bg-gray-100 focus-ring" aria-label="Basculer le mode sombre">
          <i data-theme-icon class="fas fa-moon text-gray-700" aria-hidden="true"></i>
        </button>
        <button id="nav-toggle" class="p-2 rounded focus-ring" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mobile-menu">
          <i id="nav-icon" class="fas fa-bars text-gray-700 text-xl" aria-hidden="true"></i>
        </button>
      </div>

    </div>

    <!-- Panneau mobile -->
    <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-gray-100">
      <a href="{{base}}index.html" class="block px-4 py-3 text-gray-700 hover:bg-gray-50" data-nav="accueil">Accueil</a>

      <button id="mobile-teams-toggle" class="w-full flex justify-between items-center px-4 py-3 text-gray-700 hover:bg-gray-50" aria-expanded="false" aria-controls="mobile-teams-menu">
        <span>Équipes</span>
        <i id="mobile-teams-icon" class="fas fa-chevron-down text-xs transition-transform" aria-hidden="true"></i>
      </button>
      <div id="mobile-teams-menu" class="hidden bg-gray-50 pl-4">
        <p class="px-4 py-2 text-sm text-gray-500">Chargement…</p>
      </div>
      <a href="{{base}}equipes.html" class="block px-4 py-3 text-gray-700 hover:bg-gray-50" data-nav="equipes">Toutes les équipes</a>

      <a href="{{base}}agenda.html" class="block px-4 py-3 text-gray-700 hover:bg-gray-50" data-nav="agenda">Agenda</a>
      <a href="{{base}}actualites.html" class="block px-4 py-3 text-gray-700 hover:bg-gray-50" data-nav="actualites">Actualités</a>
      <a href="{{base}}partenaires.html" class="block px-4 py-3 text-gray-700 hover:bg-gray-50" data-nav="partenaires">Partenaires</a>
      <a href="{{base}}boutique.html" class="block px-4 py-3 text-gray-700 hover:bg-gray-50" data-nav="boutique">Boutique</a>
      <a href="{{base}}contact.html" class="block px-4 py-3 text-gray-700 hover:bg-gray-50" data-nav="contact">Contact</a>
    </div>
  </nav>
</header>
