<!--
  partials/navbar.html — En-tête du site, injecté par core/partials.js.

  {{base}} est remplacé à l'injection par la profondeur de la page courante
  (« » à la racine, « ../ » depuis equipes/).

  Les sous-menus « Équipes » (#teams-menu-desktop et #teams-menu-mobile) sont
  générés depuis assets/data/teams.json par ui/navigation.js : ne pas y écrire
  d'équipe en dur.
-->

<div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>

<header class="site-header" id="site-header">
  <div class="container site-header__inner">

    <a href="{{base}}index.html" class="brand">
      <img src="{{base}}assets/images/Logo.jpg" alt="" width="44" height="44">
      <span class="brand__name">
        ABBC
        <small>Cornebarrieu</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="Navigation principale">
      <a href="{{base}}index.html" class="nav-link" data-nav="accueil">Accueil</a>

      <div class="nav-item">
        <a href="{{base}}equipes.html" class="nav-link" data-nav="equipes">
          Équipes <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </a>
        <div class="mega" id="teams-menu-desktop">
          <p>Chargement…</p>
        </div>
      </div>

      <a href="{{base}}agenda.html" class="nav-link" data-nav="agenda">Agenda</a>
      <a href="{{base}}actualites.html" class="nav-link" data-nav="actualites">Actus</a>
      <a href="{{base}}partenaires.html" class="nav-link" data-nav="partenaires">Partenaires</a>
      <a href="{{base}}boutique.html" class="nav-link" data-nav="boutique">Boutique</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Basculer le mode sombre">
        <i data-theme-icon class="fas fa-moon" aria-hidden="true"></i>
      </button>

      <a href="{{base}}contact.html" class="btn btn--accent btn--sm nav-cta" data-nav="contact">
        Nous rejoindre
      </a>

      <button type="button" class="icon-btn burger" id="nav-toggle"
              aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mobile-nav">
        <i id="nav-icon" class="fas fa-bars" aria-hidden="true"></i>
      </button>
    </div>

  </div>
</header>

<!-- Panneau de navigation mobile -->
<div class="mobile-nav" id="mobile-nav">
  <a href="{{base}}index.html" class="mobile-nav__link" data-nav="accueil">Accueil</a>

  <button type="button" class="mobile-nav__link" id="mobile-teams-toggle"
          aria-expanded="false" aria-controls="teams-menu-mobile">
    <span>Équipes</span>
    <i class="fas fa-chevron-down" aria-hidden="true"></i>
  </button>
  <div class="mobile-nav__sub" id="teams-menu-mobile"></div>

  <a href="{{base}}equipes.html" class="mobile-nav__link" data-nav="equipes">Toutes les équipes</a>
  <a href="{{base}}agenda.html" class="mobile-nav__link" data-nav="agenda">Agenda</a>
  <a href="{{base}}actualites.html" class="mobile-nav__link" data-nav="actualites">Actualités</a>
  <a href="{{base}}partenaires.html" class="mobile-nav__link" data-nav="partenaires">Partenaires</a>
  <a href="{{base}}boutique.html" class="mobile-nav__link" data-nav="boutique">Boutique</a>
  <a href="{{base}}contact.html" class="mobile-nav__link" data-nav="contact">Contact</a>
</div>
