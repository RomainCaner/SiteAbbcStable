# Met à jour les classements du club depuis resultats.ffbb.com.
#
# Le script écrit assets/data/standings.json ; s'il a changé, le workflow le
# commite sur main, ce qui déclenche automatiquement le redéploiement Pages.
#
# Rien n'est commité tant qu'aucune équipe n'a d'identifiant `ffbb.championshipId`
# renseigné dans assets/data/teams.json : le site reste alors sur les widgets
# Score'n'co.

name: Classements FFBB

on:
  schedule:
    # Trois passages par semaine, calés sur le rythme réel des rencontres :
    # samedi soir et dimanche en fin d'après-midi, une fois les matchs joués,
    # plus un rattrapage en milieu de semaine pour les résultats saisis en
    # retard. Inutile d'interroger la FFBB tous les jours — et moins on tape,
    # mieux on est reçu.
    #
    # Les heures sont en UTC. 21h55 UTC = 23h55 en heure d'été, 22h55 en heure
    # d'hiver : le créneau reste dans la soirée du même jour toute l'année.
    # L'inverse (fixer 22h55 UTC pour l'hiver) ferait basculer le passage du
    # samedi au dimanche pendant les mois d'été.
    - cron: '55 21 * * 3,6'   # mercredi et samedi, 23h55 heure française
    - cron: '0 16 * * 0'      # dimanche, 18h00 heure française
  workflow_dispatch:  # bouton « Run workflow » dans l'onglet Actions
    inputs:
      decouvrir:
        description: >-
          URL d'une page FFBB du club (page du club ou d'une de ses équipes).
          Renseignée, le workflow ne met rien à jour : il liste les identifiants
          de championnat où le club apparaît, à reporter dans teams.json.
        required: false
        type: string
      sonder:
        description: >-
          URL d'une page de compétition à ouvrir dans un vrai navigateur, pour
          relever l'adresse de l'API qui sert le classement. Ne met rien à jour.
        required: false
        type: string
      poules:
        description: >-
          Nom de club à chercher dans l'API FFBB (« Cornebarrieu » par défaut).
          Liste ses engagements de la saison avec l'identifiant de poule à
          reporter dans teams.json. Ne met rien à jour.
        required: false
        type: string

# Un seul déploiement à la fois, pour éviter deux commits concurrents.
concurrency:
  group: classements
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour commiter le JSON

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      # Le runner GitHub a un accès Internet complet, contrairement à un
      # environnement de développement restreint : c'est ici qu'on peut
      # interroger la FFBB pour retrouver les identifiants.
      - name: Trouver les identifiants de championnat
        if: inputs.decouvrir != ''
        run: python scripts/fetch_standings.py --discover "${{ inputs.decouvrir }}"

      # competitions.ffbb.com charge son classement après l'affichage de la
      # page : une requête HTTP simple ne le voit pas. Ce sondage ouvre la page
      # dans Chromium et note quelle adresse le site interroge réellement.
      # L'API FFBB expose directement les engagements d'un club et la poule de
      # chacun : plus besoin de relever les identifiants dans les URL du site.
      - name: Lister les poules du club
        if: inputs.poules != ''
        run: python scripts/decouvrir_poules.py "${{ inputs.poules }}"

      - name: Sonder l'API du classement
        if: inputs.sonder != ''
        timeout-minutes: 8
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/decouvrir_api.mjs "${{ inputs.sonder }}"

      - name: Récupérer les classements
        if: inputs.decouvrir == '' && inputs.sonder == '' && inputs.poules == ''
        id: fetch
        # Le script sort en code 1 si une équipe échoue. On ne veut pas faire
        # échouer tout le workflow pour un championnat momentanément
        # indisponible : on note le résultat et on décide ensuite.
        run: |
          set +e
          python scripts/fetch_standings.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Commiter si les données ont changé
        if: inputs.decouvrir == '' && inputs.sonder == '' && inputs.poules == ''
        run: |
          # Deux fichiers : les classements et le calendrier. Le second bouge
          # plus souvent (l'horaire d'une rencontre peut changer sans que le
          # classement bouge), d'où le test sur les deux.
          fichiers="assets/data/standings.json assets/data/fixtures.json"
          if git diff --quiet -- $fichiers; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $fichiers
          git commit -m "Classements et rencontres FFBB au $(date -u '+%d/%m/%Y')"
          git push

      - name: Signaler les échecs de récupération
        if: inputs.decouvrir == '' && inputs.sonder == '' && inputs.poules == '' && steps.fetch.outputs.code != '0'
        run: |
          echo "::warning::Au moins un championnat n'a pas pu être récupéré."
          echo "Vérifiez les identifiants ffbb.championshipId dans assets/data/teams.json,"
          echo "ou la structure de la page si la FFBB a changé son site."
